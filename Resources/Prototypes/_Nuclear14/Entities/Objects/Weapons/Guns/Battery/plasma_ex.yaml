- type: entity
  name: plasma pistol EX
  parent: N14BaseWeaponPowerCellSmall
  id: N14WeaponPlasmaPistolEX
  description: A highly advanced plasma pistol with an upgraded rate of fire.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Battery/plasma_pistol2.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-2
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Guns/Battery/plasma_pistol2.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14PlasmaCartridge
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - N14PlasmaCartridge
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Gun
    soundGunshot:
      collection: N14PlasmaDefenderGunshot
    fireRate: 3.5
  - type: FollowDistance
    backStrength: 6
  - type: StaticPrice
    price: 100
  - type: Cautery
    speed: 0.01